<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestionale Negozio</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f5f1;--card:#fffdfa;--ink:#2a2521;--mut:#7b7068;--line:#ece6df;--acc:#0f766e;--on:#fff;--soft:#dff1ee;--bad:#c2303a;--bbg:#fde6e8;--c1:#0f766e;--s1:#dff1ee;--c2:#c2417a;--s2:#fbe3ee;--c3:#c98a0b;--s3:#fbefcf;--c4:#5b50d6;--s4:#e9e6fb}
.c1{--c:var(--c1);--s:var(--s1)}.c2{--c:var(--c2);--s:var(--s2)}.c3{--c:var(--c3);--s:var(--s3)}.c4{--c:var(--c4);--s:var(--s4)}
@media(prefers-color-scheme:dark){:root{--bg:#171412;--card:#211d1a;--ink:#f3ede6;--mut:#a39a91;--line:#342e29;--acc:#4fd1c5;--on:#06302d;--soft:#1d3a38;--bad:#ff8a8f;--bbg:#432125;--c1:#4fd1c5;--s1:#1d3a38;--c2:#ff8fc0;--s2:#43233a;--c3:#f2c14e;--s3:#41341a;--c4:#a99bff;--s4:#2b2750}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Figtree',system-ui,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3,.logo{font-family:'Figtree',system-ui,sans-serif;letter-spacing:-.02em}
h1{font-size:30px;font-weight:800;margin:0}h2{margin:0 0 16px;font-size:22px;font-weight:800}h3{margin:0 0 12px;font-size:17px}h4{margin:18px 0 8px}
small{display:block;color:var(--mut);font-size:12.5px;font-weight:400}h4 small{display:inline;margin-left:6px}
.mut{color:var(--mut);margin:2px 0 0}.pad{padding:18px}.r{text-align:right}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
#nav{position:sticky;top:0;height:100vh;padding:24px 14px;display:flex;flex-direction:column;gap:4px;background:var(--card);border-right:1px solid var(--line)}
.logo{color:var(--acc);font-weight:800;font-size:21px;padding:0 12px 20px}
#nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--ink);font-weight:500}#nav a::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--c)}
#nav a:hover{background:var(--bg)}#nav a.on{background:var(--s);font-weight:700}#nav .out{margin-top:auto;color:var(--mut)}#nav .out::before{display:none}
main{padding:30px 36px;max-width:1180px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}.k2{grid-template-columns:repeat(2,1fr)}
.kpi{background:var(--s);border-color:transparent}.kpi span{color:var(--ink);opacity:.75;font-size:13px;font-weight:600}.kpi small{color:var(--ink);opacity:.62}.kpi strong{display:block;font:800 28px 'Figtree',sans-serif;margin:4px 0 2px}.kpi.warn strong{color:var(--bad)}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:14px}
.bars{display:flex;gap:10px;height:180px;align-items:flex-end}.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;color:var(--mut)}
.bars i{width:100%;max-width:48px;background:var(--acc);border-radius:6px 6px 2px 2px;min-height:3px}.bars b{color:var(--ink);font-size:12px}.bars .t i{background:var(--c2)}
.row,.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.pill{display:inline-block;background:var(--soft);color:var(--acc);padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;margin:2px 4px 2px 0}.pill.bad{background:var(--bbg);color:var(--bad)}.tag{display:inline-block;background:var(--s,var(--line));color:var(--ink);padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 12px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:12px}label input,label select,label textarea{margin-top:5px;font-weight:400}
.search{margin-bottom:14px;padding:12px 16px;font-size:16px}.bar{display:grid;grid-template-columns:1fr 240px;gap:10px}
.btn,.ghost{font:inherit;font-weight:600;border:0;border-radius:9px;padding:10px 18px;cursor:pointer}
.btn{background:var(--acc);color:var(--on)}.btn:hover{opacity:.9}.btn.big{width:100%;padding:14px;font-size:16px}.ghost{background:var(--soft);color:var(--acc)}.ghost.bad{background:var(--bbg);color:var(--bad)}
.tbl{padding:4px 8px;overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12.5px;font-weight:600;color:var(--mut);padding:12px 12px 8px}
td{padding:12px;border-top:1px solid var(--line);vertical-align:top}tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}tr.off{opacity:.5}th.r{text-align:right}
.pos{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}#res{max-height:62vh;overflow:auto}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 6px;cursor:pointer;border-radius:8px}.item:hover{background:var(--soft)}.item .r{text-align:right}.lowt{color:var(--bad)}
.cart{position:sticky;top:20px;border:1.5px dashed color-mix(in srgb,var(--mut) 55%,transparent);font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:16px}
.total{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1.5px dashed var(--line)}.total strong{font:800 30px 'Figtree',sans-serif}
#mdl{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:20}#mdl[hidden]{display:none}
.box{background:var(--card);border-radius:16px;padding:26px;width:min(700px,100%);max-height:92vh;overflow:auto}
.f2,.f3{display:grid;gap:12px;grid-template-columns:1fr 1fr}.f3{grid-template-columns:1.4fr 1fr 1fr}
.vr{display:grid;grid-template-columns:1fr 1fr 1.4fr .7fr .7fr 34px;gap:6px;margin-bottom:6px}.vr button{border:0;background:var(--bbg);color:var(--bad);border-radius:8px;cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px}.chk input{width:auto;margin:0}
.acts{display:flex;gap:8px;margin-top:18px}.acts span{flex:1}
.auth{max-width:380px;margin:12vh auto;padding:0 20px}.auth h1{margin-bottom:4px}.auth form{margin-top:22px}.err{color:var(--bad);margin:0 0 10px}.lnk{display:block;text-align:center;margin-top:14px;color:var(--mut);cursor:pointer;font-size:13px}
#tst{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:30;font-weight:600}#tst.show{opacity:1;transform:translate(-50%,0)}#tst.bad{background:var(--bad);color:#fff}
@media(max-width:820px){.shell{grid-template-columns:1fr}#nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:10;border-right:0;border-top:1px solid var(--line)}.logo{display:none}#nav a{white-space:nowrap}#nav .out{margin:0}main{padding:18px 16px 90px}.pos,.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.cart{position:static}.f2,.f3,.bar{grid-template-columns:1fr}.vr{grid-template-columns:1fr 1fr}h1{font-size:25px}}
@media(prefers-reduced-motion:reduce){#tst{transition:none}}
</style>
</head>
<body>
<div id="app"></div><div id="mdl" hidden></div><div id="tst"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0);
const dt=d=>new Date(d).toLocaleString('it-IT',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const CATS=['Intimo','Calze','Abbigliamento da lavoro','Accessori','Altro'],PAY=['Contanti','Carta','Satispay','Altro'];
const NAV=[['dash','Panoramica'],['cassa','Cassa'],['mag','Magazzino'],['cli','Clienti'],['ven','Vendite']];
let db,S={view:'dash',p:[],c:[],v:[],cart:[],q:'',cat:'',per:6};
const cc=c=>{const i=CATS.indexOf(c);return i>=0&&i<4?'c'+(i+1):''};
const vl=v=>[v.taglia,v.colore].filter(Boolean).join(' · ');
const vars=()=>S.p.flatMap(p=>p.varianti.map(v=>({...v,p})));
const lowList=()=>vars().filter(v=>v.p.attivo&&v.giacenza<=v.scorta_minima).sort((a,b)=>a.giacenza-b.giacenza);
const head=(t,s,a='')=>`<header class="top"><div><h1>${t}</h1><p class="mut">${s}</p></div>${a}</header>`;
const kpi=(l,v,s,c='')=>`<div class="card kpi ${c}"><span>${l}</span><strong>${v}</strong><small>${s}</small></div>`;
const sum=a=>a.reduce((s,x)=>s+ +x.totale,0);
function toast(m,bad){const t=$('#tst');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3200)}
function modal(h){const m=$('#mdl');m.innerHTML=`<div class="box">${h}</div>`;m.hidden=false}
function closeM(){$('#mdl').hidden=true}
$('#mdl').onclick=e=>{if(e.target.id==='mdl')closeM()};
document.onkeydown=e=>{if(e.key==='Escape')closeM()};

/* Accesso e collegamento */
function card(t,s,b){$('#app').innerHTML=`<div class="auth"><h1>${t}</h1><p class="mut">${s}</p>${b}</div>`}
function setup(){card('Collega il database','Incolla i dati del tuo progetto Supabase (Project Settings → API).',`<form onsubmit="saveCfg(event)"><label>Project URL<input id="u" placeholder="https://xxxx.supabase.co" required></label><label>Chiave anon / publishable<input id="k" required></label><button class="btn big">Collega</button></form>`)}
function saveCfg(e){e.preventDefault();ls.set('sb_url',$('#u').value.trim());ls.set('sb_key',$('#k').value.trim());boot()}
function login(m){card('Accedi','Usa l’utente creato in Supabase → Authentication.',`<form onsubmit="doLogin(event)"><label>Email<input id="em" type="email" required></label><label>Password<input id="pw" type="password" required></label><p class="err">${esc(m||'')}</p><button class="btn big">Entra</button><a class="lnk" onclick="resetCfg()">Cambia database</a></form>`)}
async function doLogin(e){e.preventDefault();const{error}=await db.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});error?login('Email o password non corretta.'):start()}
function resetCfg(){ls.set('sb_url','');ls.set('sb_key','');boot()}
function boot(){const u=ls.get('sb_url'),k=ls.get('sb_key');if(!u||!k)return setup();db=supabase.createClient(u,k);db.auth.getSession().then(({data})=>data.session?start():login())}
async function start(){$('#app').innerHTML='<div class="shell"><nav id="nav"></nav><main id="main"></main></div>';await load()}
async function load(){
 const[p,c,v]=await Promise.all([db.from('prodotti').select('*,varianti(*)').order('nome'),db.from('clienti').select('*').order('nome'),db.from('vendite').select('*,clienti(nome),righe_vendita(*)').order('created_at',{ascending:false}).limit(500)]);
 const er=p.error||c.error||v.error;if(er)return toast(er.message+' — hai eseguito schema.sql?',1);
 S.p=p.data;S.c=c.data;S.v=v.data;render()}
function render(){
 $('#nav').innerHTML=`<div class="logo">Il mio negozio</div>`+NAV.map(([k,l],i)=>`<a class="c${i%4+1} ${S.view===k?'on':''}" onclick="go('${k}')">${l}</a>`).join('')+`<a class="out" onclick="db.auth.signOut().then(boot)">Esci</a>`;
 ({dash,cassa,mag,cli,ven})[S.view]()}
function go(v){S.view=v;S.q='';render()}

/* Panoramica */
function dash(){
 const now=new Date(),same=(d,e)=>new Date(d).toDateString()===e.toDateString();
 const oggi=S.v.filter(x=>same(x.created_at,now)),mese=S.v.filter(x=>{const d=new Date(x.created_at);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});
 const low=lowList(),val=S.p.reduce((s,p)=>s+p.varianti.reduce((t,v)=>t+Math.max(v.giacenza,0),0)*p.costo,0);
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return{d,t:sum(S.v.filter(x=>same(x.created_at,d)))}}),mx=Math.max(...days.map(x=>x.t),1);
 $('#main').innerHTML=`${head('Panoramica','Come sta andando il negozio')}
 <div class="kpis">${kpi('Incasso di oggi',eur(sum(oggi)),oggi.length+' vendite','c1')}${kpi('Incasso del mese',eur(sum(mese)),mese.length+' vendite','c2')}${kpi('Da riordinare',low.length,'articoli sotto scorta','c3'+(low.length?' warn':''))}${kpi('Valore magazzino',eur(val),'al prezzo di acquisto','c4')}</div>
 <div class="grid2"><section class="card"><h3>Ultimi 7 giorni</h3><div class="bars">${days.map((x,i)=>`<div class="${i===6?'t':''}"><b>${Math.round(x.t)} €</b><i style="height:${x.t/mx*75}%"></i><span>${x.d.toLocaleDateString('it-IT',{weekday:'short'})}</span></div>`).join('')}</div></section>
 <section class="card"><h3>Da riordinare</h3>${low.slice(0,8).map(v=>`<div class="row"><span>${esc(v.p.nome)}<small>${esc(vl(v))}</small></span><span class="pill bad">${v.giacenza} pz</span></div>`).join('')||'<p class="mut">Tutto a posto: nessun articolo sotto scorta.</p>'}</section></div>`}

/* Cassa */
function cassa(){
 $('#main').innerHTML=`${head('Cassa','Cerca un articolo o scansiona il codice a barre')}
 <div class="pos"><section class="card"><input id="q" class="search" placeholder="Nome, marca, taglia, colore, codice…" oninput="S.q=this.value;renderRes()" onkeydown="if(event.key==='Enter')scan()" value="${esc(S.q)}" autofocus><div id="res"></div></section>
 <section class="card cart"><h3>Scontrino</h3><div id="lines"></div>
 <label>Cliente (facoltativo)<select id="sel-cli"><option value="">Cliente di passaggio</option>${S.c.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></label>
 <div class="f2"><label>Pagamento<select id="sel-pay">${PAY.map(p=>`<option>${p}</option>`).join('')}</select></label><label>Sconto €<input id="sel-sc" type="number" min="0" step="0.5" value="0" oninput="cartUI()"></label></div>
 <div class="total"><span>Totale</span><strong id="tot"></strong></div><button class="btn big" onclick="incassa()">Incassa</button></section></div>`;renderRes();cartUI()}
function renderRes(){const q=S.q.toLowerCase().trim();
 const r=vars().filter(v=>v.p.attivo&&(!q||[v.p.nome,v.p.marca,v.taglia,v.colore,v.barcode,v.p.categoria].join(' ').toLowerCase().includes(q))).slice(0,40);
 $('#res').innerHTML=r.map(v=>`<button class="item" onclick="add('${v.id}')"><span><b>${esc(v.p.nome)}</b><small>${esc(vl(v)||v.p.categoria)}</small></span><span class="r"><b>${eur(v.p.prezzo)}</b><small class="${v.giacenza<=v.scorta_minima?'lowt':''}">${v.giacenza} in magazzino</small></span></button>`).join('')||'<p class="mut pad">Nessun articolo trovato. Aggiungilo da Magazzino.</p>'}
function scan(){const q=S.q.trim(),v=vars().find(x=>x.barcode&&x.barcode===q);if(v){add(v.id);S.q='';$('#q').value='';renderRes()}}
function add(id){const v=vars().find(x=>x.id===id),i=S.cart.find(x=>x.v.id===id);i?i.qty++:S.cart.push({v,qty:1});cartUI()}
function qty(id,d){const i=S.cart.find(x=>x.v.id===id);i.qty+=d;if(i.qty<1)S.cart=S.cart.filter(x=>x!==i);cartUI()}
function cartUI(){
 const sub=S.cart.reduce((s,i)=>s+i.qty*i.v.p.prezzo,0);
 $('#lines').innerHTML=S.cart.map(i=>`<div class="line"><span><b>${esc(i.v.p.nome)}</b><small class="${i.qty>i.v.giacenza?'lowt':''}">${esc(vl(i.v))}${i.qty>i.v.giacenza?' · più dei pezzi in magazzino':''}</small></span><span class="qty"><button onclick="qty('${i.v.id}',-1)" aria-label="Meno">−</button>${i.qty}<button onclick="qty('${i.v.id}',1)" aria-label="Più">+</button></span><b>${eur(i.qty*i.v.p.prezzo)}</b></div>`).join('')||'<p class="mut pad">Lo scontrino è vuoto. Scegli un articolo a sinistra.</p>';
 $('#tot').textContent=eur(Math.max(sub-(+$('#sel-sc').value||0),0))}
async function incassa(){
 if(!S.cart.length)return toast('Aggiungi almeno un articolo',1);
 const righe=S.cart.map(i=>({variante_id:i.v.id,descrizione:i.v.p.nome+(vl(i.v)?' '+vl(i.v):''),quantita:i.qty,prezzo_unit:i.v.p.prezzo}));
 const{error}=await db.rpc('registra_vendita',{p_cliente:$('#sel-cli').value||null,p_pagamento:$('#sel-pay').value,p_sconto:+$('#sel-sc').value||0,p_righe:righe});
 if(error)return toast(error.message,1);
 S.cart=[];toast('Vendita registrata');load()}

/* Magazzino */
function mag(){
 $('#main').innerHTML=`${head('Magazzino','Prodotti, taglie e giacenze','<button class="btn" onclick="prodForm()">+ Nuovo prodotto</button>')}
 <div class="bar"><input class="search" placeholder="Cerca prodotto o marca…" oninput="S.q=this.value;magT()"><select onchange="S.cat=this.value;magT()"><option value="">Tutte le categorie</option>${CATS.map(c=>`<option ${S.cat===c?'selected':''}>${c}</option>`).join('')}</select></div><section class="card tbl" id="mt"></section>`;magT()}
function magT(){const q=S.q.toLowerCase(),r=S.p.filter(p=>(!S.cat||p.categoria===S.cat)&&(!q||(p.nome+' '+(p.marca||'')).toLowerCase().includes(q)));
 $('#mt').innerHTML=`<table><thead><tr><th>Prodotto</th><th>Categoria</th><th>Taglie e pezzi</th><th class="r">Prezzo</th><th class="r">Totale pezzi</th></tr></thead><tbody>${r.map(p=>`<tr onclick="prodForm('${p.id}')" class="${p.attivo?'':'off'}"><td><b>${esc(p.nome)}</b><small>${esc(p.marca||'')}${p.attivo?'':' · non in vendita'}</small></td><td><span class="tag ${cc(p.categoria)}">${esc(p.categoria)}</span></td><td>${p.varianti.map(v=>`<span class="pill ${v.giacenza<=v.scorta_minima?'bad':''}">${esc(vl(v)||'unica')}: ${v.giacenza}</span>`).join('')}</td><td class="r">${eur(p.prezzo)}</td><td class="r"><b>${p.varianti.reduce((s,v)=>s+v.giacenza,0)}</b></td></tr>`).join('')||'<tr><td colspan="5" class="mut pad">Nessun prodotto. Aggiungi il primo con “Nuovo prodotto”.</td></tr>'}</tbody></table>`}
const vrow=v=>`<div class="vr" data-id="${v.id||''}"><input name="taglia" placeholder="Taglia" value="${esc(v.taglia)}"><input name="colore" placeholder="Colore" value="${esc(v.colore)}"><input name="barcode" placeholder="Codice a barre" value="${esc(v.barcode)}"><input name="giacenza" type="number" title="Pezzi" value="${v.giacenza}"><input name="scorta_minima" type="number" title="Scorta minima" value="${v.scorta_minima}"><button type="button" onclick="this.parentNode.remove()" aria-label="Rimuovi">×</button></div>`;
function addVr(){$('#vrs').insertAdjacentHTML('beforeend',vrow({giacenza:0,scorta_minima:2}))}
function prodForm(id){
 const p=S.p.find(x=>x.id===id)||{nome:'',marca:'',categoria:CATS[0],prezzo:'',costo:'',attivo:true,varianti:[{giacenza:0,scorta_minima:2}]};
 modal(`<h2>${id?'Modifica prodotto':'Nuovo prodotto'}</h2><form onsubmit="saveProd(event,'${id||''}')">
 <div class="f2"><label>Nome<input name="nome" value="${esc(p.nome)}" required></label><label>Marca<input name="marca" value="${esc(p.marca)}"></label></div>
 <div class="f3"><label>Categoria<select name="categoria">${CATS.map(c=>`<option ${p.categoria===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Prezzo di vendita €<input name="prezzo" type="number" step="0.01" min="0" value="${p.prezzo}" required></label><label>Costo di acquisto €<input name="costo" type="number" step="0.01" min="0" value="${p.costo}"></label></div>
 <h4>Taglie e colori <small>taglia, colore, codice a barre, pezzi, scorta minima</small></h4><div id="vrs">${p.varianti.map(vrow).join('')}</div>
 <button type="button" class="ghost" onclick="addVr()">+ Aggiungi taglia o colore</button>
 <label class="chk"><input type="checkbox" name="attivo" ${p.attivo?'checked':''}> In vendita</label>
 <div class="acts">${id?`<button type="button" class="ghost bad" onclick="delProd('${id}')">Elimina</button>`:''}<span></span><button type="button" class="ghost" onclick="closeM()">Annulla</button><button class="btn">Salva prodotto</button></div></form>`)}
async function saveProd(e,id){
 e.preventDefault();const f=new FormData(e.target);
 const base={nome:f.get('nome').trim(),marca:f.get('marca').trim()||null,categoria:f.get('categoria'),prezzo:+f.get('prezzo'),costo:+f.get('costo')||0,attivo:f.get('attivo')==='on'};
 let pid=id,r;
 if(id)r=await db.from('prodotti').update(base).eq('id',id);else{r=await db.from('prodotti').insert(base).select().single();pid=r.data?.id}
 if(r.error)return toast(r.error.message,1);
 const rows=[...document.querySelectorAll('.vr')].map(el=>{const g=n=>el.querySelector(`[name=${n}]`).value.trim();return{id:el.dataset.id,prodotto_id:pid,taglia:g('taglia'),colore:g('colore'),barcode:g('barcode')||null,giacenza:parseInt(g('giacenza'))||0,scorta_minima:parseInt(g('scorta_minima'))||0}});
 const old=(S.p.find(x=>x.id===id)?.varianti||[]).map(v=>v.id),del=old.filter(i=>!rows.some(x=>x.id===i));
 if(del.length)await db.from('varianti').delete().in('id',del);
 const upd=rows.filter(x=>x.id),ins=rows.filter(x=>!x.id).map(({id,...x})=>x);
 const rs=await Promise.all([upd.length&&db.from('varianti').upsert(upd),ins.length&&db.from('varianti').insert(ins)]);
 const er=rs.find(x=>x&&x.error);if(er)return toast(er.error.message,1);
 closeM();toast('Prodotto salvato');load()}
async function delProd(id){if(!confirm('Eliminare il prodotto e tutte le sue taglie?'))return;const{error}=await db.from('prodotti').delete().eq('id',id);error?toast(error.message,1):(closeM(),toast('Prodotto eliminato'),load())}

/* Clienti */
function cli(){
 $('#main').innerHTML=`${head('Clienti','La tua rubrica clienti','<button class="btn" onclick="cliForm()">+ Nuovo cliente</button>')}<input class="search" placeholder="Cerca per nome o telefono…" oninput="S.q=this.value;cliT()"><section class="card tbl" id="ct"></section>`;cliT()}
function cliT(){const q=S.q.toLowerCase(),tot=id=>sum(S.v.filter(x=>x.cliente_id===id));
 $('#ct').innerHTML=`<table><thead><tr><th>Nome</th><th>Telefono</th><th>Email</th><th class="r">Totale speso</th></tr></thead><tbody>${S.c.filter(c=>!q||(c.nome+(c.telefono||'')).toLowerCase().includes(q)).map(c=>`<tr onclick="cliForm('${c.id}')"><td><b>${esc(c.nome)}</b><small>${esc(c.note||'')}</small></td><td>${esc(c.telefono||'—')}</td><td>${esc(c.email||'—')}</td><td class="r">${eur(tot(c.id))}</td></tr>`).join('')||'<tr><td colspan="4" class="mut pad">Nessun cliente. Aggiungi il primo con “Nuovo cliente”.</td></tr>'}</tbody></table>`}
function cliForm(id){const c=S.c.find(x=>x.id===id)||{};
 modal(`<h2>${id?'Modifica cliente':'Nuovo cliente'}</h2><form onsubmit="saveCli(event,'${id||''}')"><label>Nome e cognome<input name="nome" value="${esc(c.nome)}" required></label><div class="f2"><label>Telefono<input name="telefono" value="${esc(c.telefono)}"></label><label>Email<input name="email" type="email" value="${esc(c.email)}"></label></div><label>Note (taglie, preferenze…)<textarea name="note" rows="3">${esc(c.note)}</textarea></label><div class="acts">${id?`<button type="button" class="ghost bad" onclick="delCli('${id}')">Elimina</button>`:''}<span></span><button type="button" class="ghost" onclick="closeM()">Annulla</button><button class="btn">Salva cliente</button></div></form>`)}
async function saveCli(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),{error}=await(id?db.from('clienti').update(f).eq('id',id):db.from('clienti').insert(f));error?toast(error.message,1):(closeM(),toast('Cliente salvato'),load())}
async function delCli(id){if(!confirm('Eliminare il cliente? Le sue vendite restano nello storico.'))return;const{error}=await db.from('clienti').delete().eq('id',id);error?toast(error.message,1):(closeM(),toast('Cliente eliminato'),load())}

/* Vendite */
function ven(){
 const lim=new Date();lim.setHours(0,0,0,0);lim.setDate(lim.getDate()-S.per);
 const r=S.v.filter(x=>new Date(x.created_at)>=lim),t=sum(r);
 $('#main').innerHTML=`${head('Vendite','Storico degli incassi',`<select onchange="S.per=+this.value;ven()">${[[0,'Oggi'],[6,'Ultimi 7 giorni'],[29,'Ultimi 30 giorni'],[9999,'Tutte']].map(([k,l])=>`<option value="${k}" ${S.per===k?'selected':''}>${l}</option>`).join('')}</select>`)}
 <div class="kpis k2">${kpi('Incasso',eur(t),r.length+' vendite','c1')}${kpi('Scontrino medio',eur(r.length?t/r.length:0),'per vendita','c2')}</div>
 <section class="card tbl"><table><thead><tr><th>Data</th><th>Cliente</th><th>Pezzi</th><th>Pagamento</th><th class="r">Totale</th></tr></thead><tbody>${r.map(x=>`<tr onclick="venDet('${x.id}')"><td>${dt(x.created_at)}</td><td>${esc(x.clienti?.nome||'—')}</td><td>${x.righe_vendita.reduce((s,i)=>s+i.quantita,0)}</td><td>${esc(x.pagamento)}</td><td class="r"><b>${eur(x.totale)}</b></td></tr>`).join('')||'<tr><td colspan="5" class="mut pad">Nessuna vendita in questo periodo.</td></tr>'}</tbody></table></section>`}
function venDet(id){const x=S.v.find(v=>v.id===id);
 modal(`<h2>Vendita del ${dt(x.created_at)}</h2>${x.righe_vendita.map(i=>`<div class="row"><span>${i.quantita} × ${esc(i.descrizione)}</span><b>${eur(i.quantita*i.prezzo_unit)}</b></div>`).join('')}${+x.sconto?`<div class="row"><span>Sconto</span><b>−${eur(x.sconto)}</b></div>`:''}<div class="total"><span>Totale (${esc(x.pagamento)})</span><strong>${eur(x.totale)}</strong></div><div class="acts"><span></span><button class="btn" onclick="closeM()">Chiudi</button></div>`)}

boot();
</script>
</body>
</html>
